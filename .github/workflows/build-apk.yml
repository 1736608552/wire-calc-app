name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin || true
          chmod +x gradlew || true

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Package
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-apks/WireCalc-v1.0.1.apk \;
          ls -la release-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireCalc-Android-APK
          path: release-apks/WireCalc-v1.0.1.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "WireCalc v1.0.1 (阻值线径速算器)"
          body: |
            ### ⚡ 阻值线径速算器 (WireCalc) v1.0.1
            
            根据物理原理 $R_1 \times r_1^2 = R_2 \times r_2^2$，输入任意 3 个数，即可自动实时计算出第 4 个数！

            #### 🔄 本次更新：
            - 去除“带入原图示例”按钮，界面更加清爽专注；
            - 保留清空所有按钮与完整实时四选三速算功能。

            #### 📥 下载安装：
            - 下载下方附件中的 **`WireCalc-v1.0.1.apk`** 直接在安卓手机上覆盖更新安装即可。
          files: release-apks/WireCalc-v1.0.1.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
